<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3d63">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ペーロンレース Peiron Race</title>
<link rel="icon" href="img/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=M+PLUS+Rounded+1c:wght@500;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="scene"></canvas>

  <!-- race HUD -->
  <div id="hud" class="hidden">
    <div id="pos"><b>1</b><i>st</i></div>
    <div id="combo"><span></span><span></span><span></span><em>BOOST!</em><u>れんぞく</u></div>
    <div id="track">
      <div class="lbl l">スタート</div><div class="lbl m">ターン</div><div class="lbl r">ゴール</div>
      <div class="bar"><div class="turnmark" id="trackTurn"></div></div><div id="dist"></div>
      <div id="trackBoats"></div>
    </div>
  </div>
  <div id="topBtns">
    <button class="rbtn" id="btnSound" title="おと"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke-width="2.2" stroke-linecap="round"/><path class="off" d="M16.5 9.5l5 5m0-5l-5 5" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <button class="rbtn" id="btnQr" title="QRコード"><svg viewBox="0 0 24 24"><path d="M3 3h7v7H3zM14 3h7v7h-7zM3 14h7v7H3z" fill="none" stroke-width="2.4" stroke-linejoin="round"/><path d="M6 6h1v1H6zM17 6h1v1h-1zM6 17h1v1H6zM14 14h3v3h-3zM19 14h2v2h-2zM14 19h2v2h-2zM18 18h3v3h-3z" stroke-width="1"/></svg></button>
    <button class="rbtn" id="btnFull" title="ぜんがめん"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="rbtn hidden" id="btnHome" title="やめる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke-width="3" stroke-linecap="round"/></svg></button>
  </div>
  <div id="banner"></div>
  <div id="popups"></div>

  <!-- question dock -->
  <div id="dock">
    <div id="card"></div>
    <div id="qarea">
      <div id="qtop" class="bubble"></div>
      <div id="qline"></div>
      <div id="qbot" class="bubble answer"></div>
      <div id="choices">
        <button class="choice c1" data-i="0"><span class="key">1</span><span class="t"></span></button>
        <button class="choice c2" data-i="1"><span class="key">2</span><span class="t"></span></button>
      </div>
    </div>
  </div>

  <!-- title / mode select -->
  <div id="title" class="screen">
    <div class="logo">
      <div class="jp">ペーロン<span>レース</span></div>
      <div class="en">PEIRON RACE</div>
      <div class="tag">ただしい ことばを えらんで、ふねを こごう！</div>
    </div>
    <div id="modeGrid"></div>
  </div>

  <!-- setup -->
  <div id="setup" class="screen hidden">
    <div class="setupBox">
      <div class="leftCol"><div id="setupMode"></div>
        <button class="rulesBtn" id="btnRules"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5v13c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z" fill="#fff"/><path d="M12 6v13.5" stroke="#c2410c" stroke-width="2"/></svg>ルールを みる</button></div>
      <div class="opts">
        <div class="opt"><label>ふねの いろ</label><div class="seg" id="segColor"></div></div>
        <div class="opt"><label>コース</label><div class="seg pics" id="segLen">
          <button data-v="0.5"><i class="len s"></i>みじかい</button><button data-v="1" class="on"><i class="len l"></i>ながい</button></div></div>
        <div class="opt"><label>あいて</label><div class="seg pics" id="segCpu">
          <button data-v="0"><i class="stars">★</i>やさしい</button><button data-v="1" class="on"><i class="stars">★★</i>ふつう</button><button data-v="2"><i class="stars">★★★</i>つよい</button></div></div>
        <div class="opt"><label>チームめい</label><input id="nameIn" maxlength="10" placeholder="なくても OK" autocomplete="off" spellcheck="false" list="districts"><datalist id="districts"><option>野母崎</option><option>深堀</option><option>戸町</option><option>香焼</option><option>小ヶ倉</option><option>福田</option><option>三重</option><option>牧島</option><option>式見</option><option>小榊</option></datalist></div>
        <div class="how">
          <div><b>1</b>えらぶ</div><i></i>
          <div><b>2</b>せいかいで はやく！</div><i></i>
          <div><b>3</b>3れんぞくで ブースト！</div>
        </div>
        <div class="setupBtns"><button class="big ghost" id="btnBack">もどる</button><button class="big go" id="btnStart">スタート！</button></div>
      </div>
    </div>
  </div>

  <!-- results -->
  <div id="results" class="screen hidden">
    <canvas id="confetti"></canvas>
    <div class="resRow">
    <div class="resBox">
      <div id="resHead"></div>
      <div id="podium"></div>
      <div id="resStats"></div>
      <div class="fact" id="factRes"></div>
      <div class="revTitle">もういちど よんで みよう</div>
      <div id="review"></div>
      <div class="setupBtns"><button class="big ghost" id="btnMenu">ほかの ゲーム</button><button class="big go" id="btnAgain">もういちど！</button></div>
    </div>
    <div id="lb" class="hidden">
      <div class="lbHead"><b>ランキング</b><span>TOP 100</span></div>
      <div id="lbSub"></div>
      <div id="lbView"><div id="lbList"></div></div>
      <div id="lbNote"></div>
    </div>
    </div>
  </div>

  <!-- grammar rules card -->
  <div id="rules" class="screen hidden">
    <div class="rulesBox">
      <div class="rulesHead" id="rulesHead"></div>
      <div class="rulesTabs" id="rulesTabs"></div>
      <div class="rulesBody" id="rulesBody"></div>
      <div class="rulesFoot"><button class="big go" id="btnRulesOk">わかった！</button></div>
    </div>
  </div>

  <!-- QR code -->
  <div id="qr" class="screen hidden">
    <div class="qrBox">
      <div class="qrTitle">スキャンして あそぼう！</div>
      <div class="qrCode" id="qrCode"></div>
      <div class="qrUrl" id="qrUrl"></div>
      <button class="big go" id="btnQrOk">とじる</button>
    </div>
  </div>

  <div id="loading" class="hidden">よみこみちゅう…</div>
</div>

<script src="js/questions.js"></script>
<script src="js/assets.js"></script>
<script src="js/sfx.js"></script>
<script src="js/qrcode.js"></script>
<script src="js/lb-config.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/scene.js"></script>
<script src="js/game.js"></script>
</body>
</html>
